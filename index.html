<title>The Emperor's Problem: Ise, the Great Buddha, and the Making of Authority</title>

<body>
<header>
  <h1 id="title"></h1>
  <span class="muted" id="pass"></span>
</header>
<p class="obj" id="objective"></p>
<div class="bar"><i id="progress"></i></div>
<div class="meta"><span id="pos"></span><span id="score"></span></div>
<main id="stage" aria-live="polite"></main>
<footer id="footer"></footer>

<script type="module">

const KINDS = ['choice', 'multi', 'order', 'match', 'classify', 'numeric', 'text', 'explain', 'reveal'];

const norm = value => String(value ?? '').trim().toLowerCase().replace(/\s+/g, ' ');
const num = value => {
  const n = Number(String(value ?? '').replace(/[,_\s]/g, '').replace(/%$/, ''));
  return Number.isFinite(n) ? n : null;
};

/* ---------------------------------------------------------------- spec */

/** Structural rules a spec must satisfy before it is worth publishing. */
function validate(spec) {
  const errors = [];
  const warnings = [];
  const meta = spec?.meta || {};
  const steps = spec?.steps;

  if (!meta.title) errors.push('meta.title is required (it names the page and the repo)');
  if (!meta.objective) errors.push('meta.objective is required (what they can do afterwards)');
  if (!meta.audience) errors.push('meta.audience is required (what they already know)');
  if (!Array.isArray(steps) || steps.length === 0) {
    errors.push('steps must be a non-empty array');
    return { errors, warnings };
  }

  const ids = new Set();
  const seen = new Set();
  steps.forEach((step, i) => {
    const at = `step ${i + 1}`;
    if (!step.id) errors.push(`${at}: id is required`);
    if (ids.has(step.id)) errors.push(`${at}: duplicate id "${step.id}"`);
    ids.add(step.id);
    if (!KINDS.includes(step.kind)) errors.push(`${at}: unknown kind "${step.kind}"`);
    if (!step.prompt) errors.push(`${at}: prompt is required — one sentence, the thing they answer`);
    if (!step.why) warnings.push(`${at}: no "why" — say what this step checks so the feedback can land`);
    if (!step.difficulty) warnings.push(`${at}: no difficulty (1-3) — useful for balancing the set`);

    if (step.kind === 'choice' || step.kind === 'multi') {
      const options = step.options || [];
      if (options.length < 2) errors.push(`${at}: needs at least two options`);
      const correct = options.filter(o => o.correct);
      if (step.kind === 'choice' && correct.length !== 1) errors.push(`${at}: choice needs exactly one correct option`);
      if (step.kind === 'multi' && correct.length < 1) errors.push(`${at}: multi needs at least one correct option`);
      options.forEach((o, j) => {
        if (!o.text) errors.push(`${at}: option ${j + 1} has no text`);
        if (!o.feedback) {
          // The single most important rule in this file: a wrong option
          // teaches only if the feedback says why it is wrong.
          errors.push(`${at}: option ${j + 1} has no feedback — every option explains itself`);
        }
      });
    }
    if (step.kind === 'order') {
      const order = step.order || step.items || [];
      if (order.length < 3) errors.push(`${at}: order needs at least three items`);
    }
    if (step.kind === 'match') {
      const pairs = step.pairs || [];
      if (pairs.length < 3) errors.push(`${at}: match needs at least three pairs`);
      pairs.forEach((p, j) => {
        if (!p.left || !p.right) errors.push(`${at}: pair ${j + 1} needs both sides`);
      });
    }
    if (step.kind === 'classify') {
      if ((step.buckets || []).length < 2) errors.push(`${at}: classify needs at least two buckets`);
      (step.items || []).forEach((item, j) => {
        if (!item.text || !item.bucket) errors.push(`${at}: item ${j + 1} needs text and a bucket`);
        else if (!(step.buckets || []).includes(item.bucket)) errors.push(`${at}: item ${j + 1} names an unknown bucket`);
      });
    }
    if (step.kind === 'numeric' && typeof step.answer !== 'number') errors.push(`${at}: numeric needs a numeric answer`);
    if ((step.kind === 'text' || step.kind === 'numeric') && !(step.accept || []).length && step.kind === 'text') {
      warnings.push(`${at}: text step with no accept list accepts anything (use it only for opinion)`);
    }
    if ((step.kind === 'explain' || step.kind === 'reveal') && !step.reveal) {
      errors.push(`${at}: ${step.kind} needs the model explanation in "reveal"`);
    }
  });

  // Difficulty ramp: a set that never rises is a set that never teaches
  // the last mile (fading guidance — Renkl & Atkinson 2003).
  const levels = steps.map(s => Number(s.difficulty) || 0).filter(Boolean);
  if (levels.length > 2 && levels[levels.length - 1] < Math.max(...levels)) {
    warnings.push('the last step is not the hardest — end the set at its peak difficulty');
  }
  if (levels.length > 2 && !levels.some(l => l >= 2)) {
    warnings.push('every step is difficulty 1 — add at least one that needs real work');
  }

  const explained = steps.filter(s => s.kind === 'explain').length;
  if (steps.length >= 6 && explained === 0) {
    warnings.push('no self-explanation step — a "why does this hold?" prompt is what turns recognition into understanding');
  }
  return { errors, warnings };
}

/* --------------------------------------------------------------- grade */

/** Grade one answer. Returns correctness plus the feedback to show. */
function grade(step, answer) {
  switch (step.kind) {
    case 'choice':
    case 'multi': {
      const chosen = new Set([].concat(answer ?? []).map(String));
      const correct = new Set((step.options || []).filter(o => o.correct).map(o => o.id));
      const same = chosen.size === correct.size && [...chosen].every(c => correct.has(c));
      if (same) {
        const picked = (step.options || []).find(o => o.correct && chosen.has(o.id));
        return { correct: true, feedback: picked?.feedback || step.why || 'Correct.' };
      }
      const firstWrong = (step.options || []).find(o => chosen.has(o.id) && !o.correct);
      return {
        correct: false,
        feedback: firstWrong?.feedback || step.hint || 'Not this one.',
        answer: (step.options || []).filter(o => o.correct).map(o => o.text).join(', ')
      };
    }
    case 'order': {
      const truth = (step.order || step.items || []).map(x => (typeof x === 'string' ? x : x.id ?? x.text));
      const given = [].concat(answer ?? []).map(String);
      const hits = given.filter((g, i) => g === String(truth[i])).length;
      return {
        correct: hits === truth.length && given.length === truth.length,
        feedback: hits === truth.length ? (step.feedback || 'That is the right order.') : step.feedback || `First ${hits} of ${truth.length} positions are right — the failure is further along.`,
        answer: truth.join(' → ')
      };
    }
    case 'match': {
      const pairs = step.pairs || [];
      const given = answer || {};
      const wrong = pairs.filter(p => String(given[p.left]) !== String(p.right));
      return {
        correct: wrong.length === 0,
        feedback: wrong.length === 0 ? (step.feedback || 'All matched.') : `Still unmatched: ${wrong.map(p => p.left).join(', ')}`,
        answer: pairs.map(p => `${p.left} → ${p.right}`).join('; ')
      };
    }
    case 'classify': {
      const bucketOf = new Map((step.items || []).map(i => [i.text, i.bucket]));
      const given = answer || {};
      const wrong = [...bucketOf.entries()].filter(([text, bucket]) => String(given[text]) !== String(bucket));
      return {
        correct: wrong.length === 0,
        feedback: wrong.length === 0 ? (step.feedback || 'Every item is in the right bucket.') : `Look again at: ${wrong.map(([t]) => t).join(', ')}`,
        answer: [...bucketOf.entries()].map(([t, b]) => `${t} → ${b}`).join('; ')
      };
    }
    case 'numeric': {
      const value = num(answer);
      if (value === null) return { correct: false, feedback: 'That is not a number.', answer: String(step.answer) };
      const tol = Number(step.tolerance ?? 0);
      const ok = Math.abs(value - step.answer) <= tol;
      return {
        correct: ok,
        feedback: ok ? (step.feedback || 'Right.') : step.feedback || `Close is not it — check your units and the boundary case. The answer is ${step.answer}.`,
        answer: String(step.answer)
      };
    }
    case 'text': {
      const given = norm(answer);
      const ok = (step.accept || []).some(a => norm(a) === given);
      return {
        correct: ok,
        feedback: ok ? (step.feedback || 'Right.') : step.feedback || `Compare with: ${(step.accept || [])[0] ?? step.reveal ?? ''}`,
        answer: (step.accept || [])[0]
      };
    }
    case 'explain':
    case 'reveal':
      return { correct: true, feedback: step.reveal, answer: null, explained: true };
    default:
      return { correct: false, feedback: 'Unknown step kind.', answer: null };
  }
}

/* ------------------------------------------------------------- session */

/**
 * A session is the whole run: the steps in order, what was missed, and
 * the second pass. Answers are graded on the *first* attempt so that a
 * lucky guess stays visible in the summary.
 */
function createSession(spec, options = {}) {
  const steps = spec.steps.map(step => ({ ...step }));
  const byId = new Map(steps.map(step => [step.id, step]));
  const state = {
    order: steps.map(s => s.id),
    index: 0,
    pass: 1,
    results: new Map(),      // id -> { firstTry, attempts, hints, correct }
    misses: []
  };

  const current = () => byId.get(state.order[state.index]) || null;

  function submit(stepId, answer) {
    const step = byId.get(stepId);
    const prior = state.results.get(stepId) || { firstTry: null, attempts: 0, hints: 0, correct: false };
    const graded = grade(step, answer);
    prior.attempts += 1;
    if (prior.firstTry === null) prior.firstTry = graded.correct;
    prior.correct = graded.correct;
    state.results.set(stepId, prior);
    if (!graded.correct && state.pass === 1 && !state.misses.includes(stepId)) state.misses.push(stepId);
    return graded;
  }

  function next() {
    if (state.index < state.order.length - 1) {
      state.index += 1;
      return { done: false, step: current(), pass: state.pass };
    }
    if (options.retryMissed !== false && state.pass === 1 && state.misses.length) {
      state.pass = 2;
      state.order = [...state.misses];
      state.index = 0;
      return { done: false, step: current(), pass: 2, review: true };
    }
    return { done: true, summary: summary() };
  }

  function hint(stepId) {
    const prior = state.results.get(stepId) || { firstTry: null, attempts: 0, hints: 0, correct: false };
    prior.hints += 1;
    state.results.set(stepId, prior);
    return byId.get(stepId)?.hint || 'No hint for this one — try the step before it.';
  }

  function progress() {
    const total = state.pass === 1 ? steps.length : state.misses.length;
    return { pass: state.pass, position: state.index + 1, total, answered: [...state.results.values()].filter(r => r.correct).length };
  }

  function summary() {
    const rows = steps.map(step => {
      const r = state.results.get(step.id) || { firstTry: null, attempts: 0, hints: 0 };
      return {
        id: step.id,
        prompt: step.prompt,
        difficulty: step.difficulty || 1,
        firstTry: r.firstTry === true,
        attempts: r.attempts,
        hints: r.hints,
        source: step.source || null
      };
    });
    const firstTry = rows.filter(r => r.firstTry).length;
    return {
      total: rows.length,
      firstTry,
      firstTryRate: rows.length ? firstTry / rows.length : 0,
      missed: rows.filter(r => !r.firstTry).map(r => r.id),
      hinted: rows.filter(r => r.hints > 0).map(r => r.id),
      rows
    };
  }

  return { current, submit, next, hint, progress, summary, state: () => state };
}

      "prompt": "The timber office needs a number before it can send the order. About how many cypress trees will one renewal consume?",
      "why": "You are signing the requisition. The number is part of the argument: renewal is not maintenance, it is a statewide mobilization.",
      "difficulty": 2,
      "hint": "Coaldrake gives a figure in the thirteen thousands.",
      "source": "Coaldrake, p. 264",
      "answer": 13600,
      "tolerance": 500,
      "feedback": "About 13,600 trees, yielding some 10,000 cubic metres of timber. The order goes out to the Kiso valley; loggers will float the trunks down the river through its gorges. A single renewal draws on forests, transport, and hereditary craft guilds. This is what imperial patronage looks like on the ground."
    },
    {
      "id": "ritual",
      "kind": "order",
      "prompt": "Before you sign, you review the sequence of the renewal. Put it in order.",
      "why": "The sequence shows that rebuilding is a ritual process, not a construction project with a ceremony attached.",
      "difficulty": 2,
      "hint": "The ritual begins in the forest, before anyone touches the building site.",
      "source": "Coaldrake, p. 264",
      "feedback": "The ritual starts in the forest, not on the building site. The transfer of the mirror is the moment the new shrine becomes the god's dwelling; dismantling follows. You sign.",
      "order": [
        {
          "id": "prayers",
          "text": "Expiatory prayers are offered to the kami of the mountain where the cypress will be cut."
        },
        {
          "id": "felling",
          "text": "Cypress is felled and floated down the Kiso River."
        },
        {
          "id": "building",
          "text": "Craftsmen build the new shrine on the Alternate Site."
        },
        {
          "id": "mirror",
          "text": "The sacred mirror is transferred from the old shrine to the new."
        },
        {
          "id": "dismantling",
          "text": "The superseded buildings are dismantled."
        }
      ]
    },
    {
      "id": "nara",
      "kind": "reveal",
      "prompt": "A decade later, you are back in Nara, and the problem has changed.",
      "why": "The shrine renews your ancestry. Now you need a monument that addresses the present — and the Buddha offers a different technology of authority.",
      "difficulty": 2,
      "source": "Proclamation, pp. 275–277",
      "reveal": "It is 743. You are Shōmu, still on the throne, and the court is in Nara, the capital. Buddhism arrived from Korea and China two centuries ago, and you have encouraged it: monasteries, nunneries, and now a statue. The proclamation you are about to issue vows to cast a Lochana Buddha in gold and copper — a cosmic Buddha, not a local spirit — fifty-three feet tall and 250 tons. The image will take years to cast and gild. The temple complex that houses it will be called Tōdai-ji, the Great Eastern Temple; the eye-opening ceremony will come in 752. Ise renews a bond to the sun goddess. The Buddha will concentrate the wealth and labor of the realm into one object no one can fail to see."
    },
    {
      "id": "dictation",
      "kind": "choice",
      "prompt": "You are dictating the proclamation. The court scribe waits. Which sentence do you open with?",
      "why": "The sentence you choose tells the realm who is paying, who is benefiting, and whose authority the Buddha serves.",
      "difficulty": 2,
      "hint": "Read the next sentence: the vow to create the image follows immediately.",
      "source": "Proclamation, p. 276",
      "options": [
        {
          "id": "private",
          "text": "We, the humble servant of the Buddha, offer this statue from our private fortune.",
          "correct": false,
          "feedback": "The scribe's brush does not move. The project is too large for a private fortune, and the point is not your personal wealth. The historical proclamation claims the wealth of the land and the power of the state."
        },
        {
          "id": "power",
          "text": "It is We who possess the wealth of the land; it is We who possess all power in the land.",
          "correct": true,
          "feedback": "The brush moves. This is the sentence the historical Shōmu used. It fuses the sovereign's material power with the Buddha's spiritual power, and the vow to build the image follows immediately. Devotion is the vocabulary; state power is the infrastructure."
        },
        {
          "id": "command",
          "text": "The Buddha commands the people to fund this image without complaint.",
          "correct": false,
          "feedback": "That is the opposite of the proclamation's careful administration. The text tells provincial and county authorities not to harass the people with arbitrary demands. The project needs participation, not resentment."
        },
        {
          "id": "merit",
          "text": "This image is for the emperor's own merit; the people need not participate.",
          "correct": false,
          "feedback": "The historical text explicitly widens the benefit to all in heaven and earth, even animals and plants, and invites even a twig or a handful of dirt as an offering. A private merit-making project would miss the political point."
        }
      ]
    },
    {
      "id": "draft",
      "kind": "multi",
      "prompt": "The draft goes to the provinces. Which instructions do you leave in? Select all that apply.",
      "why": "You are editing the proclamation before the seals are applied. The text is managing money, labor, and participation, not just belief.",
      "difficulty": 3,
      "hint": "Three of these are things the historical proclamation actually orders or permits.",
      "source": "Proclamation, pp. 276–277",
      "options": [
        {
          "id": "metal",
          "text": "Claim the nation's resources of metal for the casting.",
          "correct": true,
          "feedback": "Yes — the project consumes state metal, not private wealth."
        },
        {
          "id": "twig",
          "text": "Accept even a twig or a handful of dirt as an offering.",
          "correct": true,
          "feedback": "Yes — it widens participation, making the project a national fellowship rather than an elite donation."
        },
        {
          "id": "officials",
          "text": "Tell provincial and county authorities not to harass the people with arbitrary demands.",
          "correct": true,
          "feedback": "Yes — it tries to control the labor extraction the project could otherwise unleash. That is administration, not just piety."
        },
        {
          "id": "calumny",
          "text": "Say the Buddha's heart is touched only when the project provokes calumny and bitterness.",
          "correct": false,
          "feedback": "The text says the opposite: the Buddha's heart would never be touched if calumny and bitterness were provoked. The sentence warns how the project must be run."
        },
        {
          "id": "household",
          "text": "Limit the project's benefits to the imperial household.",
          "correct": false,
          "feedback": "The text explicitly extends the benefits to all in heaven and earth, even animals and plants."
        }
      ]
    },
    {
      "id": "memorandum",
      "kind": "explain",
      "prompt": "That night, you dictate a private memorandum for your successor. In 4–6 sentences: how did the shrine and the statue each make your rule visible, and which one do you trust to last?",
      "why": "This is the synthesis the two readings are paired to produce: a comparison, not a summary. Write it in your own words before you see the model.",
      "difficulty": 3,
      "hint": "Name one concrete mechanism from each reading, then state the disagreement in one sentence.",
      "source": "Coaldrake, pp. 261–274; proclamation, pp. 275–277",
      "reveal": "Both projects make rule visible, but they disagree about what makes a monument last. At Ise, authority is renewed by repeated action: each generation rebuilds the shrine, sponsors the rituals, and passes through a graded sequence of fences and gateways. The building is not meant to survive unchanged; its power lies in the cycle, and access to the inner sanctum is itself a display of political hierarchy. My Great Buddha takes the opposite route: it concentrates the state's wealth, metal, and labor into one enormous image, and my proclamation presents that concentration as Buddhist devotion. Yet the two are not simple opposites. Both fuse religious authority with political authority, and both depend on the ruler's control of resources and ritual. The difference is the logic of legitimation: Ise renews authority by repeating the founding act, while Tōdai-ji tries to fix it in bronze. The honest answer is that they last in different senses. The bronze can be damaged or forgotten; the cycle can be interrupted by war or a broken treasury. I trust the cycle more, because it makes each successor an actor in the claim rather than a caretaker of a finished object."
    }
  ]
};

const els = {
  title: document.getElementById('title'),
  objective: document.getElementById('objective'),
  pass: document.getElementById('pass'),
  progress: document.getElementById('progress'),
  pos: document.getElementById('pos'),
  score: document.getElementById('score'),
  stage: document.getElementById('stage'),
  footer: document.getElementById('footer')
};

let session = createSession(SPEC);
let committed = null;     // answer collected but not submitted

const el = (tag, attrs = {}, ...kids) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') node.textContent = v;
    else if (k === 'html') node.innerHTML = v;
    else if (v === true) node.setAttribute(k, '');
    else if (v !== false && v != null) node.setAttribute(k, v);
  }
  kids.filter(Boolean).forEach(k => node.append(k));
  return node;
};

function render() {
  const step = session.current();
  els.title.textContent = SPEC.meta.title;
  els.objective.textContent = SPEC.meta.objective;
  els.footer.textContent = SPEC.meta.source ? `Sources: ${SPEC.meta.source}` : '';
  if (!step) return renderSummary();

  const p = session.progress();
  els.progress.style.width = Math.round((p.position - 1) / p.total * 100) + '%';
  els.pos.textContent = `Step ${p.position} of ${p.total}`;
  els.score.textContent = `${p.answered} correct so far`;
  els.pass.textContent = p.pass === 2 ? 'Second pass — only what you missed' : '';

  committed = step.kind === 'multi' ? new Set() : null;
  let answerOf = () => null;
  let afterRender = null;

  const card = el('section', { class: 'card' });
  card.append(el('p', { class: 'prompt', text: step.prompt }));
  if (step.why) card.append(el('p', { class: 'why', text: step.why }));

  const body = el('div');
  card.append(body);
  const actions = el('div', { class: 'row' });
  card.append(actions);

  switch (step.kind) {
    case 'choice':
    case 'multi': {
      const opts = el('div', { class: 'opts', role: 'group' });
      if (step.kind === 'multi') opts.dataset.multi = '1';
      const chosen = step.kind === 'multi' ? committed : { value: null };
      (step.options || []).forEach(opt => {
        const b = el('button', { type: 'button', 'aria-pressed': 'false', text: opt.text });
        b.onclick = () => {
          if (step.kind === 'multi') {
            const on = b.getAttribute('aria-pressed') === 'true';
            b.setAttribute('aria-pressed', on ? 'false' : 'true');
            on ? chosen.delete(opt.id) : chosen.add(opt.id);
          } else {
            [...opts.children].forEach(c => c.setAttribute('aria-pressed', 'false'));
            b.setAttribute('aria-pressed', 'true');
            chosen.value = opt.id;
          }
          submitBtn.disabled = false;
        };
        opts.append(b);
      });
      body.append(opts);
      answerOf = () => step.kind === 'multi' ? [...chosen] : chosen.value;
      break;
    }
    case 'order': {
      const truth = (step.order || step.items || []).map(x => typeof x === 'string' ? { id: x, text: x } : x);
      const picked = [];
      const seq = el('div', { class: 'seq' });
      const pool = el('div', { class: 'pool' });
      const draw = () => {
        seq.replaceChildren();
        picked.forEach((item, i) => {
          const b = el('button', { type: 'button' }, el('span', { text: String(i + 1) }), el('span', { text: item.text }));
          b.onclick = () => { picked.splice(i, 1); draw(); };
          seq.append(b);
        });
        pool.replaceChildren();
        truth.filter(t => !picked.includes(t)).forEach(item => {
          const b = el('button', { type: 'button', text: item.text });
          b.onclick = () => { picked.push(item); draw(); };
          pool.append(b);
        });
        submitBtn.disabled = picked.length !== truth.length;
      };
      body.append(el('p', { class: 'muted', text: 'Click the lines in the order they run. Click a chosen line to remove it.' }), seq, pool);
      answerOf = () => picked.map(p => p.id);
      afterRender = draw;
      break;
    }
    case 'match': {
      const pairs = step.pairs || [];
      const map = {};
      const rows = el('div', { class: 'seq' });
      const rightOptions = [...new Set(pairs.map(p => p.right))];
      pairs.forEach(p => {
        const sel = el('select', {});
        sel.append(el('option', { value: '', text: 'choose…' }));
        rightOptions.forEach(r => sel.append(el('option', { value: r, text: r })));
        sel.onchange = () => { map[p.left] = sel.value; submitBtn.disabled = pairs.some(x => !map[x.left]); };
        rows.append(el('div', { class: 'row' }, el('span', { text: p.left }), sel));
      });
      body.append(rows);
      answerOf = () => map;
      break;
    }
    case 'classify': {
      const map = {};
      const pool = el('div', { class: 'pool' });
      const buckets = el('div', { class: 'bucket' });
      let current = null;
      (step.items || []).forEach(item => {
        const b = el('button', { type: 'button', text: item.text });
        b.onclick = () => { current = item.text; [...pool.children].forEach(c => c.setAttribute('aria-pressed', 'false')); b.setAttribute('aria-pressed', 'true'); };
        pool.append(b);
      });
      (step.buckets || []).forEach(bucket => {
        const target = el('button', { type: 'button', text: bucket });
        target.onclick = () => {
          if (!current) return;
          map[current] = bucket;
          [...pool.children].filter(c => c.textContent === current).forEach(c => { c.disabled = true; c.setAttribute('aria-pressed', 'false'); });
          current = null;
          submitBtn.disabled = Object.keys(map).length !== (step.items || []).length;
        };
        buckets.append(target);
      });
      body.append(el('p', { class: 'muted', text: 'Pick an item, then pick the bucket it belongs in.' }), pool, buckets);
      answerOf = () => map;
      break;
    }
    case 'numeric':
    case 'text': {
      const input = el('input', { type: 'text', inputmode: step.kind === 'numeric' ? 'decimal' : 'text', autocomplete: 'off' });
      input.oninput = () => { submitBtn.disabled = input.value.trim() === ''; };
      body.append(input);
      answerOf = () => input.value;
      break;
    }
    case 'explain': {
      const ta = el('textarea', { placeholder: 'Say it in your own words before you look…' });
      ta.oninput = () => { submitBtn.disabled = ta.value.trim() === ''; };
      body.append(el('p', { class: 'muted', text: 'Answer in your own words. Nothing is graded here — the act of producing it is the point.' }), ta);
      answerOf = () => ta.value;
      break;
    }
    case 'reveal': {
      break;
    }
  }

  const label = step.kind === 'explain' ? 'Compare with the model answer' : step.kind === 'reveal' ? 'Show me' : 'Check';
  const submitBtn = el('button', { type: 'button', text: label, disabled: step.kind !== 'reveal' });
  actions.append(submitBtn);
  let hintBtn = null;
  if (step.hint) {
    hintBtn = el('button', { type: 'button', text: 'Hint' });
    hintBtn.onclick = () => {
      hintBtn.disabled = true;
      card.append(el('div', { class: 'fb', 'data-ok': 'info' }, el('b', { text: 'Hint' }), el('span', { text: session.hint(step.id) })));
    };
    actions.append(hintBtn);
  }

  submitBtn.onclick = () => {
    const graded = session.submit(step.id, answerOf());
    submitBtn.disabled = true;
    hintBtn && (hintBtn.disabled = true);
    [...card.querySelectorAll('button:not(.next), input, select, textarea')].forEach(n => n.disabled = true);

    const fb = el('div', { class: 'fb', 'data-ok': graded.correct ? '1' : '0' });
    fb.append(el('b', { text: graded.correct ? '✓ ' + (step.kind === 'explain' ? 'Model answer' : 'Correct') : '✗ Not yet' }));
    fb.append(el('span', { text: graded.feedback || '' }));
    if (!graded.correct && graded.answer) fb.append(el('div', { class: 'ans', text: `The answer: ${graded.answer}` }));
    if (step.source) fb.append(el('div', { class: 'src', text: `Source: ${step.source}` }));
    if (step.explainPrompt) fb.append(el('div', { class: 'ans', text: step.explainPrompt }));
    card.append(fb);

    const nextBtn = el('button', { class: 'next', type: 'button', text: 'Next', autofocus: true });
    nextBtn.onclick = () => { const r = session.next(); r.done ? renderSummary() : render(); };
    actions.replaceChildren(nextBtn);
    nextBtn.focus();
    els.score.textContent = `${session.progress().answered} correct so far`;
  };

  els.stage.replaceChildren(card);
  afterRender?.();
}

function renderSummary() {
  const s = session.summary();
  els.progress.style.width = '100%';
  els.pos.textContent = 'Done';
  els.score.textContent = '';
  els.pass.textContent = '';
  const card = el('section', { class: 'card summary' });
  card.append(el('h2', { text: `${s.firstTry} of ${s.total} right on the first try` }));
  const advice = s.firstTryRate >= 0.8
    ? 'That is the level to walk in with. Re-run this tomorrow rather than tonight — the gap is what makes it stick.'
    : s.firstTryRate >= 0.5
      ? 'The misses below are the whole exercise. Reread the hint, then re-run in a day.'
      : 'Most of it did not land yet. Do not reread the whole thing: work the missed items below, then ask about the ones still unclear.';
  card.append(el('p', { class: 'muted', text: advice }));

  const table = el('table');
  table.append(el('tr', {}, el('th', { text: 'Step' }), el('th', { text: 'First try' }), el('th', { text: 'Hints' })));
  s.rows.forEach(r => {
    table.append(el('tr', {},
      el('td', { text: r.prompt }),
      el('td', { text: r.firstTry ? '✓' : '✗' }),
      el('td', { text: r.hints ? String(r.hints) : '' })));
  });
  card.append(table);

  if (s.missed.length) {
    const again = el('button', { type: 'button', text: `Run the ${s.missed.length} missed step(s) again` });
    again.onclick = () => {
      session = createSession({ ...SPEC, steps: SPEC.steps.filter(x => s.missed.includes(x.id)) }, { retryMissed: false });
      render();
    };
    card.append(el('div', { class: 'row' }, again));
  }

  const answers = el('details', { class: 'skip' });
  answers.append(el('summary', { text: 'Show every answer (for review after class)' }));
  SPEC.steps.forEach(step => {
    const line = el('p', { class: 'muted' });
    const truth = step.kind === 'choice' || step.kind === 'multi'
      ? (step.options || []).filter(o => o.correct).map(o => o.text).join(', ')
      : step.kind === 'numeric' ? String(step.answer)
        : step.kind === 'text' ? (step.accept || []).join(' / ')
          : step.reveal || (step.order || []).map(o => o.text || o).join(' → ');
    line.textContent = `${step.prompt} — ${truth}`;
    answers.append(line);
  });
  card.append(answers);
  els.stage.replaceChildren(card);
}

render();
</script>
</body>
</html>
